workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Um push com MR aberto usa a pipeline do MR, sem criar outra na branch.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - when: always

stages:
  - validate
  - test

conflict-markers:
  stage: validate
  image: python:3.13-bookworm
  rules:
    - when: on_success
  script:
    - python -m unittest discover -s scripts/tests -v
    # Sondagem negativa explicita: altera somente o indice descartavel do runner.
    - |
      if [ "${CONFLICT_MARKERS_PROBE:-0}" = "1" ]; then
        printf '<<<<<<< HEAD\n' > .conflict-marker-probe
        git add -f -- .conflict-marker-probe
      fi
    - sh scripts/check-conflict-markers.sh
    - sh scripts/test-validate-mr-title.sh
    # Reutiliza o job de validate para caber no limite de jobs ativos.
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        sh scripts/validate-mr-title.sh
      fi

frontend-unit:
  stage: test
  image: node:24-bookworm
  rules:
    - when: on_success
  script:
    - cd src/frontend
    - npm ci
    - npm run lint
    - npm run format:check
    - npm run test:coverage
    - npm run build
  artifacts:
    when: always
    paths:
      - src/frontend/coverage/
    expire_in: 7 days

backend-api:
  stage: test
  image: python:3.13-bookworm
  rules:
    - when: on_success
  variables:
    HF_HOME: "$CI_PROJECT_DIR/.cache/huggingface"
  cache:
    key: REDACTED_FOR_PUBLIC_RELEASE
    paths:
      - .cache/huggingface/
  script:
    # O runner nao tem GPU. O torch do PyPI traz ~4 GB de bibliotecas CUDA,
    # que estouram o disco do runner ("No space left on device"). A roda CPU
    # tem a mesma versao (2.13.0+cpu satisfaz torch==2.13.0) e cabe no disco.
    - pip install --no-cache-dir torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
    - pip install --no-cache-dir -r src/backend/requirements.txt -r src/backend/requirements-pln.txt
    - python -c "import torch, transformers; assert torch.version.cuda is None, torch.__version__"
    - cd src/backend
    - python -m pytest app/tests -m integration --strict-markers -q -o junit_family=legacy --junitxml=evidencias/backend-junit.xml
  artifacts:
    when: always
    paths:
      - src/backend/evidencias/backend-junit.xml
    expire_in: 7 days

frontend-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  rules:
    - when: on_success
  variables:
    E2E_PYTHON: python
  before_script:
    - apt-get update && apt-get install -y python3-venv
    - python3 -m venv /tmp/frontend-e2e-venv
    - export PATH="/tmp/frontend-e2e-venv/bin:$PATH"
    - python -m pip install -r src/backend/requirements.txt
  script:
    - cd src/frontend
    - npm ci
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - src/frontend/playwright-report/
      - src/frontend/test-results/
    expire_in: 7 days
