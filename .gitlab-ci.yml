workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Um push com MR aberto usa a pipeline do MR, sem criar outra na branch.
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - when: always

# Falhas de rede do runner durante o pull acontecem antes de qualquer script.
# O retry cobre esse tipo de falha de infraestrutura sem repetir testes que
# falharam por causa do codigo.
default:
  retry:
    max: 2
    when:
      - runner_system_failure

stages:
  - validate
  - test

conflict-markers:
  stage: validate
  image: python:3.13-bookworm
  rules:
    - when: on_success
  script:
    - python -m unittest discover -s scripts/tests -v
    # Sondagem negativa explicita: altera somente o indice descartavel do runner.
    - |
      if [ "${CONFLICT_MARKERS_PROBE:-0}" = "1" ]; then
        printf '<<<<<<< HEAD\n' > .conflict-marker-probe
        git add -f -- .conflict-marker-probe
      fi
    - sh scripts/check-conflict-markers.sh
    - sh scripts/test-validate-mr-title.sh
    # Reutiliza o job de validate para caber no limite de jobs ativos.
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        sh scripts/validate-mr-title.sh
      fi

frontend-unit:
  stage: test
  image: node:24-bookworm
  rules:
    - when: on_success
  script:
    - cd src/frontend
    - npm ci
    - npm run lint
    - npm run format:check
    - npm run typecheck
    - npm run test:coverage
    - npm run build
  artifacts:
    when: always
    paths:
      - src/frontend/coverage/
      - src/frontend/test-results/unit/junit.xml
    reports:
      junit: src/frontend/test-results/unit/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: src/frontend/coverage/cobertura-coverage.xml
    expire_in: 7 days

backend-api:
  stage: test
  # A variante completa somada ao PyTorch, SciPy e cache do BERTimbau excede
  # o disco efemero do runner antes mesmo dos testes. Todas as dependencias
  # deste job possuem wheels para CPython 3.12, portanto nao precisam das
  # ferramentas de compilacao presentes na imagem bookworm completa.
  image: python:3.12-slim-bookworm
  rules:
    - when: on_success
  variables:
    HF_HOME: "$CI_PROJECT_DIR/.cache/huggingface"
    PIP_NO_CACHE_DIR: "1"
    PIP_NO_COMPILE: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  cache:
    # A chave anterior continha snapshots e pesos TensorFlow/Flax que o
    # AutoModel PyTorch nao usa. Alem de separar esse cache legado, a nova
    # chave faz a primeira instalacao ocorrer antes do download do modelo;
    # isso evita somar ~1,8 GB de cache ao pico de descompactacao do Torch.
    key: REDACTED_FOR_PUBLIC_RELEASE-pytorch-only-v2
    paths:
      - .cache/huggingface/
  script:
    # O runner nao tem GPU. O torch do PyPI traz ~4 GB de bibliotecas CUDA,
    # que estouram o disco do runner ("No space left on device"). A roda CPU
    # tem a mesma versao (2.13.0+cpu satisfaz torch==2.13.0) e cabe no disco.
    - pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
    - pip install -r src/backend/requirements.txt -r src/backend/requirements-pln.txt
    - python -c "import torch, transformers; assert torch.version.cuda is None, torch.__version__"
    - cd src/backend
    - python -m pytest app/tests/test_gemini_client.py app/tests/test_audio_upload.py app/tests/test_vhs_integration.py app/tests/test_nlp_inference.py app/tests/test_pipeline_api.py app/tests/test_traceability.py app/tests/test_alerts.py app/tests/test_response_references.py app/tests/test_response_blocks.py app/tests/test_documental_sources.py app/tests/test_database_rag.py app/tests/test_nlp_entities.py app/tests/test_rag_proactivity.py app/tests/test_sharepoint_rag.py app/tests/test_sharepoint_webhook.py app/tests/test_sharepoint_webhook_repository.py app/tests/test_sharepoint_webhook_messaging.py app/tests/test_sharepoint_reindex.py app/tests/test_llm_provider.py app/tests/test_rag_atributos_no_prompt.py app/tests/test_rnf01_rnf03_s4_33.py app/tests/test_sensitive_data_rnf01.py app/tests/test_access_security.py app/tests/test_seed_mvp_access.py app/tests/test_data_change_extractor.py app/tests/test_data_change_service.py app/tests/test_data_change_api.py app/tests/test_data_change_postgres.py app/tests/test_rnf10_rnf12_s5_32.py app/tests/test_reexecucao_s5_33.py -q -o junit_family=legacy --junitxml=evidencias/backend-junit.xml
  artifacts:
    when: always
    paths:
      - src/backend/evidencias/backend-junit.xml
    expire_in: 7 days

frontend-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  rules:
    - when: on_success
  variables:
    E2E_PYTHON: python
  before_script:
    - apt-get update && apt-get install -y python3-venv
    - python3 -m venv /tmp/frontend-e2e-venv
    - export PATH="/tmp/frontend-e2e-venv/bin:$PATH"
    - python -m pip install -r src/backend/requirements.txt
  script:
    - cd src/frontend
    - npm ci
    - npm run test:e2e
  # Relatório do E2E na pipeline (S5-23): HTML navegável e JUnit na aba de testes do MR.
  artifacts:
    when: always
    expose_as: "Relatorio E2E"
    paths:
      - src/frontend/playwright-report/
      - src/frontend/test-results/
    reports:
      junit: src/frontend/test-results/e2e/junit.xml
    expire_in: 7 days
