stages:
  - test

frontend-unit:
  stage: test
  image: node:24-bookworm
  script:
    - cd src/frontend
    - npm ci
    - npm run lint
    - npm run format:check
    - npm run test:coverage
    - npm run build
  artifacts:
    when: always
    paths:
      - src/frontend/coverage/
    expire_in: 7 days

backend-api:
  stage: test
  image: python:3.13-bookworm
  variables:
    HF_HOME: "$CI_PROJECT_DIR/.cache/huggingface"
  cache:
    key: REDACTED_FOR_PUBLIC_RELEASE
    paths:
      - .cache/huggingface/
  script:
    - pip install -r src/backend/requirements.txt -r src/backend/requirements-pln.txt
    - python -c "import torch, transformers"
    - cd src/backend
    - python -m pytest app/tests/test_gemini_client.py app/tests/test_audio_upload.py app/tests/test_nlp_inference.py app/tests/test_pipeline_api.py app/tests/test_traceability.py -q

frontend-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  variables:
    E2E_PYTHON: python
  before_script:
    - apt-get update && apt-get install -y python3-venv
    - python3 -m venv /tmp/frontend-e2e-venv
    - export PATH="/tmp/frontend-e2e-venv/bin:$PATH"
    - python -m pip install -r src/backend/requirements.txt
  script:
    - cd src/frontend
    - npm ci
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - src/frontend/playwright-report/
      - src/frontend/test-results/
    expire_in: 7 days
