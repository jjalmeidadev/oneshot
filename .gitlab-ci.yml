stages:
  - validate
  - test

conflict-markers:
  stage: validate
  image: python:3.13-bookworm
  script:
    - python -m unittest discover -s scripts/tests -v
    - sh scripts/check-conflict-markers.sh

frontend-unit:
  stage: test
  image: node:24-bookworm
  script:
    - cd src/frontend
    - npm ci
    - npm run lint
    - npm run format:check
    - npm run test:coverage
    - npm run build
  artifacts:
    when: always
    paths:
      - src/frontend/coverage/
    expire_in: 7 days

backend-api:
  stage: test
  image: python:3.13-bookworm
  variables:
    HF_HOME: "$CI_PROJECT_DIR/.cache/huggingface"
  cache:
    key: REDACTED_FOR_PUBLIC_RELEASE
    paths:
      - .cache/huggingface/
  script:
    - pip install -r src/backend/requirements.txt -r src/backend/requirements-pln.txt
    - python -c "import torch, transformers"
    - cd src/backend
    - python -m pytest app/tests -m integration --strict-markers -q -o junit_family=legacy --junitxml=evidencias/backend-junit.xml
  artifacts:
    when: always
    paths:
      - src/backend/evidencias/backend-junit.xml
    expire_in: 7 days

frontend-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  variables:
    E2E_PYTHON: python
  before_script:
    - apt-get update && apt-get install -y python3-venv
    - python3 -m venv /tmp/frontend-e2e-venv
    - export PATH="/tmp/frontend-e2e-venv/bin:$PATH"
    - python -m pip install -r src/backend/requirements.txt
  script:
    - cd src/frontend
    - npm ci
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - src/frontend/playwright-report/
      - src/frontend/test-results/
    expire_in: 7 days
