stages:
  - test

validar-titulo-mr:
  stage: test
  image: alpine:3.22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - sh scripts/test-validate-mr-title.sh
    - sh scripts/validate-mr-title.sh

frontend-unit:
  stage: test
  image: node:24-bookworm
  script:
    - cd src/frontend
    - npm ci
    - npm run lint
    - npm run format:check
    - npm run test:coverage
    - npm run build
  artifacts:
    when: always
    paths:
      - src/frontend/coverage/
    expire_in: 7 days

backend-api:
  stage: test
  image: python:3.13-bookworm
  variables:
    HF_HOME: "$CI_PROJECT_DIR/.cache/huggingface"
  cache:
    key: REDACTED_FOR_PUBLIC_RELEASE
    paths:
      - .cache/huggingface/
  script:
    # O runner nao tem GPU. O torch do PyPI traz ~4 GB de bibliotecas CUDA,
    # que estouram o disco do runner ("No space left on device"). A roda CPU
    # tem a mesma versao (2.13.0+cpu satisfaz torch==2.13.0) e cabe no disco.
    - pip install --no-cache-dir torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
    - pip install --no-cache-dir -r src/backend/requirements.txt -r src/backend/requirements-pln.txt
    - python -c "import torch, transformers; assert torch.version.cuda is None, torch.__version__"
    - cd src/backend
    - python -m pytest app/tests/test_gemini_client.py app/tests/test_audio_upload.py app/tests/test_vhs_integration.py app/tests/test_nlp_inference.py app/tests/test_pipeline_api.py app/tests/test_traceability.py app/tests/test_alerts.py app/tests/test_response_references.py app/tests/test_database_rag.py app/tests/test_nlp_entities.py app/tests/test_rag_proactivity.py app/tests/test_sharepoint_rag.py app/tests/test_llm_provider.py app/tests/test_rag_atributos_no_prompt.py app/tests/test_access_security.py app/tests/test_seed_mvp_access.py -q -o junit_family=legacy --junitxml=evidencias/backend-junit.xml
  artifacts:
    when: always
    paths:
      - src/backend/evidencias/backend-junit.xml
    expire_in: 7 days

frontend-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  variables:
    E2E_PYTHON: python
  before_script:
    - apt-get update && apt-get install -y python3-venv
    - python3 -m venv /tmp/frontend-e2e-venv
    - export PATH="/tmp/frontend-e2e-venv/bin:$PATH"
    - python -m pip install -r src/backend/requirements.txt
  script:
    - cd src/frontend
    - npm ci
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - src/frontend/playwright-report/
      - src/frontend/test-results/
    expire_in: 7 days
